<style>
:root{
  --font-display:'Golos Text',system-ui,sans-serif;
  --font-body:'PT Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;

  --bg:#F2F4F5;
  --surface:#FFFFFF;
  --surface-2:#E8ECEE;
  --surface-3:#DBE2E5;
  --border:#D6DEE2;
  --text:#1B2226;
  --text-2:#55636B;
  --text-3:#8B9AA3;
  --accent:#C8283C;
  --accent-ink:#FFFFFF;
  --accent-soft:#F8DEE2;
  --accent-soft-ink:#8A1B2A;
  --slate:#232E37;
  --slate-2:#3B4A55;
  --slate-ink:#C7D2D8;
  --good:#2F8F5B; --good-soft:#DEF0E4; --good-ink:#1D6B41;
  --warn:#B8791A; --warn-soft:#F6E9CE; --warn-ink:#8C5B10;
  --critical:#C1440E; --critical-soft:#F7DFD1; --critical-ink:#943308;
  --shadow: 0 1px 2px rgba(20,30,35,.07), 0 10px 26px -14px rgba(20,30,35,.22);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14181B; --surface:#1B2126; --surface-2:#212A30; --surface-3:#29343B;
    --border:#333F47; --text:#EDF2F4; --text-2:#A8B7BF; --text-3:#728089;
    --accent:#E9576C; --accent-ink:#20060A; --accent-soft:rgba(233,87,108,.16); --accent-soft-ink:#F3A5B0;
    --slate:#10161A; --slate-2:#26333C; --slate-ink:#C7D2D8;
    --good:#4FB781; --good-soft:rgba(79,183,129,.16); --good-ink:#8FDBB4;
    --warn:#DDA83F; --warn-soft:rgba(221,168,63,.16); --warn-ink:#EFC57A;
    --critical:#E2703B; --critical-soft:rgba(226,112,59,.16); --critical-ink:#F3A374;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14181B; --surface:#1B2126; --surface-2:#212A30; --surface-3:#29343B;
  --border:#333F47; --text:#EDF2F4; --text-2:#A8B7BF; --text-3:#728089;
  --accent:#E9576C; --accent-ink:#20060A; --accent-soft:rgba(233,87,108,.16); --accent-soft-ink:#F3A5B0;
  --slate:#10161A; --slate-2:#26333C; --slate-ink:#C7D2D8;
  --good:#4FB781; --good-soft:rgba(79,183,129,.16); --good-ink:#8FDBB4;
  --warn:#DDA83F; --warn-soft:rgba(221,168,63,.16); --warn-ink:#EFC57A;
  --critical:#E2703B; --critical-soft:rgba(226,112,59,.16); --critical-ink:#F3A374;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.6);
}

/* ---- accent color options (Настройки → Оформление) ---- */
:root[data-accent="blue"]{ --accent:#2461D9; --accent-ink:#FFFFFF; --accent-soft:#DCE7FB; --accent-soft-ink:#173E8C; }
:root[data-accent="green"]{ --accent:#1F9D55; --accent-ink:#FFFFFF; --accent-soft:#DBF2E3; --accent-soft-ink:#146B39; }
:root[data-accent="purple"]{ --accent:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#EAE0FC; --accent-soft-ink:#4C1D95; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="blue"]{ --accent:#5B8DEF; --accent-ink:#0B1B33; --accent-soft:rgba(91,141,239,.18); --accent-soft-ink:#AFC6F5; }
  :root:not([data-theme="light"])[data-accent="green"]{ --accent:#3FBE7C; --accent-ink:#08251A; --accent-soft:rgba(63,190,124,.18); --accent-soft-ink:#9EE3BE; }
  :root:not([data-theme="light"])[data-accent="purple"]{ --accent:#9B6BF2; --accent-ink:#1D1235; --accent-soft:rgba(155,107,242,.18); --accent-soft-ink:#CFB8FA; }
}
:root[data-theme="dark"][data-accent="blue"]{ --accent:#5B8DEF; --accent-ink:#0B1B33; --accent-soft:rgba(91,141,239,.18); --accent-soft-ink:#AFC6F5; }
:root[data-theme="dark"][data-accent="green"]{ --accent:#3FBE7C; --accent-ink:#08251A; --accent-soft:rgba(63,190,124,.18); --accent-soft-ink:#9EE3BE; }
:root[data-theme="dark"][data-accent="purple"]{ --accent:#9B6BF2; --accent-ink:#1D1235; --accent-soft:rgba(155,107,242,.18); --accent-soft-ink:#CFB8FA; }

*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--text);}
a{color:inherit;}
button{font-family:inherit; font-size:inherit;}
::selection{background:var(--accent-soft); color:var(--accent-soft-ink);}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.muted{color:var(--text-2);}
.faint{color:var(--text-3);}
.hidden{display:none!important;}

/* ---- layout shell ---- */
#app{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--slate); color:var(--slate-ink);
  display:flex; flex-direction:column; padding:20px 14px; gap:4px;
}
.brand{display:flex; flex-direction:column; gap:2px; padding:2px 8px 18px; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,.09);}
.brand .word{font-family:var(--font-display); font-weight:700; font-size:22px; color:#fff; letter-spacing:.5px;}
.brand .word em{font-style:normal; color:var(--accent);}

.brand .stripe{width:34px; height:3px; background:var(--accent); border-radius:2px; margin:5px 0 7px;}
.brand .tag{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:#8492A0;}
.navgroup-label{font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:#6C7A87; padding:14px 10px 4px;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
  color:var(--slate-ink); font-size:14px; font-weight:500;
}
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:var(--accent); color:var(--accent-ink);}
.navitem .ic{width:24px; text-align:center; opacity:.95; font-family:var(--font-mono); font-size:19px;}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.09);}
.who{padding:8px 10px; font-size:12.5px; color:#9FACB8; display:flex; flex-direction:column; gap:1px;}
.who b{color:#fff; font-weight:600; font-size:13.5px;}
.logout-btn{width:100%; text-align:left; padding:8px 10px; border-radius:8px; background:none; border:none; color:#C6D0D8; cursor:pointer; font-size:13px;}
.logout-btn:hover{background:rgba(255,255,255,.06); color:#fff;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:5;
}
.topbar h1{font-size:19px;}
.content{padding:22px 26px 60px; overflow-x:hidden;}
.content-inner{max-width:1180px;}

/* doctor shell (simpler, mobile-first) */
.doc-shell{min-height:100vh; display:flex; flex-direction:column;}
.doc-top{
  background:var(--slate); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
}
.doc-top .word{font-family:var(--font-display); font-weight:700; font-size:18px;}
.doc-top .word em{font-style:normal; color:var(--accent);}
.doc-tabs{display:flex; gap:6px; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; position:sticky; top:0; z-index:5;}
.doc-tab{padding:8px 14px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--text-2);}
.doc-tab.active{background:var(--accent-soft); color:var(--accent-soft-ink);}
.doc-content{padding:18px; max-width:640px; margin:0 auto; width:100%;}

/* ---- basic components ---- */
.card-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.grid{display:grid; gap:14px;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
.stat-tile .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--text-3); font-weight:600;}
.stat-tile .value{font-family:var(--font-mono); font-size:23px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums;}
.stat-tile .sub{font-size:12px; color:var(--text-2); margin-top:2px;}
.stat-tile.accent .value{color:var(--accent);}
.stat-tile.crit .value{color:var(--critical);}
.stat-tile.good .value{color:var(--good);}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px; border:1px solid transparent;
  font-weight:600; font-size:13.5px; cursor:pointer; background:var(--surface-2); color:var(--text);
}
.btn:hover{filter:brightness(0.97);}
.btn.primary{background:var(--accent); color:var(--accent-ink);}
.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-2);}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
.btn.danger{background:var(--critical-soft); color:var(--critical-ink);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

label.field{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600; color:var(--text-2);}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=password],input[type=url],select,textarea{
  font-family:var(--font-body); font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); width:100%;
}
textarea{resize:vertical; min-height:64px;}
input:focus,select:focus,textarea:focus,button:focus-visible,.navitem:focus-visible,.card:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.check{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--text-2); cursor:pointer;}
.hint{font-size:12px; color:var(--text-3); font-weight:400;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.2px;}
.badge.good{background:var(--good-soft); color:var(--good-ink);}
.badge.warn{background:var(--warn-soft); color:var(--warn-ink);}
.badge.crit{background:var(--critical-soft); color:var(--critical-ink);}
.badge.accent{background:var(--accent-soft); color:var(--accent-soft-ink);}
.badge.neutral{background:var(--surface-2); color:var(--text-2);}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-3); padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700;}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.table-wrap table{min-width:560px;}

/* ---- board / kanban ---- */
.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; align-items:flex-start;}
.column{background:var(--surface-2); border-radius:var(--radius); min-width:250px; width:250px; flex-shrink:0; max-height:calc(100vh - 190px); display:flex; flex-direction:column;}
.column-head{padding:11px 13px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
.column-head .name{font-weight:700; font-size:13px;}
.column-head .count{font-family:var(--font-mono); font-size:12px; color:var(--text-3);}
.column-sum{padding:0 13px 8px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-2);}
.column-body{padding:9px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; flex:1;}
.column-empty{padding:16px 10px; text-align:center; color:var(--text-3); font-size:12px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:8px;
  padding:10px 11px; box-shadow:var(--shadow); cursor:pointer;
}
.card:hover{border-color:var(--accent);}
.card.due-ok{border-left-color:var(--good);}
.card.due-soon{border-left-color:var(--warn);}
.card.due-late{border-left-color:var(--critical);}
.card .code{font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); font-weight:600;}
.card .pat{font-weight:700; font-size:13.5px; margin-top:3px;}
.card .doc{font-size:12px; color:var(--text-2); margin-top:1px;}
.card .metaRow{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:6px;}
.card .due{font-size:11.5px; font-weight:700;}
.card .due.due-ok{color:var(--good-ink);}
.card .due.due-soon{color:var(--warn-ink);}
.card .due.due-late{color:var(--critical-ink);}
.card .money{font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); margin-top:5px;}

/* ---- order form / tooth chart ---- */
.tooth-chart{display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; padding:8px 2px;}
.tq{display:flex; gap:3px; flex-wrap:wrap;}
.tq.rev{flex-direction:row-reverse;}
.tooth-btn{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface);
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.tooth-btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
.arch-label{font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.6px; width:100%; margin-bottom:2px;}

.draft-line{border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:var(--surface-2); margin-bottom:8px;}
.draft-line .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.draft-line .name{font-weight:700; font-size:13px;}
.draft-line .price{font-family:var(--font-mono); font-size:12px; color:var(--text-2);}
.draft-line .rm{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:16px; line-height:1; padding:2px 4px;}
.draft-line .rm:hover{color:var(--critical);}
.qtyBox{display:flex; align-items:center; gap:8px; margin-top:6px;}
.qtyBox input{width:70px;}
.linetotal{margin-top:8px; text-align:right; font-family:var(--font-mono); font-weight:700; font-size:13px;}

.link-row{display:flex; gap:8px; margin-bottom:7px;}
.dropzone{
  border:1.5px dashed var(--border); border-radius:10px; padding:18px 16px; display:flex; align-items:center; gap:12px;
  cursor:pointer; background:var(--surface-2); font-size:13px; color:var(--text-2);
}
.dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
.dropzone .dz-ic{ font-size:22px; color:var(--accent); flex-shrink:0; }
.dropzone b{ color:var(--text); }
.upload-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.upload-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:7px 10px; }
.upload-row .uname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.upload-row .rm{ background:none; border:none; color:var(--text-3); cursor:pointer; font-size:15px; line-height:1; }
.upload-row .rm:hover{ color:var(--critical); }
.uprog{ width:90px; height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex-shrink:0; }
.uprog-bar{ height:100%; background:var(--accent); border-radius:3px; transition:width .15s; }
.link-row input:first-child{max-width:170px;}

.order-total-bar{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:14px 18px;

.order-total-bar .sum{font-family:var(--font-mono); font-size:20px; font-weight:700;}

/* ---- modal ---- */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,20,23,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
.modal{background:var(--surface); border-radius:var(--radius); max-width:640px; width:100%; box-shadow:var(--shadow); border:1px solid var(--border);}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}

.modal-close{background:none; border:none; font-size:20px; color:var(--text-3); cursor:pointer; line-height:1;}

/* ============================= APPEARANCE (theme / accent) ============================= */
function getThemeMode(){ try{ return localStorage.getItem('medlab_theme')||'system'; }catch(e){ return 'system'; } }
function getAccent(){ try{ return localStorage.getItem('medlab_accent')||'red'; }catch(e){ return 'red'; } }
function applyAppearance(){
  var root = document.documentElement;
  var mode = getThemeMode();
  if(mode==='light') root.setAttribute('data-theme','light');
  else if(mode==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  var accent = getAccent();
  if(accent && accent!=='red') root.setAttribute('data-accent', accent);
  else root.removeAttribute('data-accent');
}
applyAppearance();

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtMoney(n){ n = Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' сом'; }
function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; var dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'); return dd+'.'+mm+'.'+d.getFullYear(); }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, n){ var d = iso? new Date(iso+'T00:00:00') : new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function toast(msg){ state.ui.toast = msg; render(); setTimeout(function(){ state.ui.toast=null; render(); }, 2600); }

function cfg(){ return state.data.config || DEFAULT_CONFIG; }
function brandWord(){ return esc((cfg().labName || DEFAULT_CONFIG.labName)); }

/* ============================= INIT / API DB CLIENT ============================= */
// Thin client that mimics the collection/doc interface the app was built
// against, backed by the standalone REST API + Socket.IO (see server/).
function createApiDb(){
  var socket = (typeof io === 'function') ? io({transports:['websocket','polling']}) : null;
  var listeners = []; // {collection, cb}
  if(socket){
    socket.on('change', function(evt){
      listeners.forEach(function(l){ if(l.collection===evt.collection) l.cb(); });
    });
  }
  async function req(method, url, body){
    var res = await fetch(url, {
      method: method,
      headers: body!==undefined ? {'Content-Type':'application/json'} : undefined,
      body: body!==undefined ? JSON.stringify(body) : undefined
    });
    if(!res.ok){ var t=''; try{t=await res.text();}catch(e){} throw new Error('HTTP '+res.status+' '+t); }
    return res.json();
  }
  function makeDocRef(coll, id){
    return {
      id: id,
      get: async function(){
        var r = await req('GET', '/api/doc/'+coll+'/'+encodeURIComponent(id));
        return { exists: r.exists, data: function(){ return r.data; } };
      },
      set: async function(data){ await req('PUT', '/api/doc/'+coll+'/'+encodeURIComponent(id), data); },
      update: async function(patch){ await req('PATCH', '/api/doc/'+coll+'/'+encodeURIComponent(id), patch); },
      delete: async function(){ await req('DELETE', '/api/doc/'+coll+'/'+encodeURIComponent(id)); },
      onSnapshot: function(next, err){
        var self = this;
        function pull(){ self.get().then(next).catch(function(e){ if(err) err(e); }); }
        listeners.push({ collection: coll, cb: pull });
        pull();
      }
    };
  }
  function makeCollRef(coll, opts){
    opts = opts || {};
    return {
      doc: function(id){ return makeDocRef(coll, id || (Date.now().toString(36)+Math.random().toString(36).slice(2,8))); },
      add: async function(data){ var r = await req('POST', '/api/doc/'+coll, data); return { id: r.id }; },
      orderBy: function(field, dir){ return makeCollRef(coll, Object.assign({}, opts, {orderBy:field, dir:dir||'asc'})); },
      limit: function(n){ return makeCollRef(coll, Object.assign({}, opts, {limit:n})); },
      get: async function(){
        var qs = [];
        if(opts.orderBy) qs.push('orderBy='+encodeURIComponent(opts.orderBy)+'&dir='+encodeURIComponent(opts.dir||'asc'));
        if(opts.limit) qs.push('limit='+opts.limit);
        var rows = await req('GET', '/api/collection/'+coll+(qs.length?'?'+qs.join('&'):''));
        return { docs: rows.map(function(r){ return { id:r.id, data:function(){ return r.data; } }; }), empty: rows.length===0 };
      },
      onSnapshot: function(next, err){
        var self = this;
        function pull(){ self.get().then(next).catch(function(e){ if(err) err(e); }); }
        listeners.push({ collection: coll, cb: pull });
        pull();
      }
    };
  }
  return {
    doc: function(path){ var parts=path.split('/'); return makeDocRef(parts[0], parts.slice(1).join('/')); },
    collection: function(path){ return makeCollRef(path); }
  };
}

async function init(){
  render();
  var db = null;
  try{ db = createApiDb(); }catch(e){ console.error(e); db = null; }
  state.db = db; state.dbTried = true;
  if(!db){ render(); return; }

  db.doc('settings/config').onSnapshot(function(snap){
    var raw = snap.exists ? snap.data() : {};
    var merged = Object.assign({}, DEFAULT_CONFIG, raw);
    // migrate legacy urgentMultiplier (x1.4) -> urgentPercent (40) — must check the
    // RAW saved doc, since Object.assign already backfilled merged.urgentPercent
    // from DEFAULT_CONFIG when the saved doc simply lacks the key.
    if((raw.urgentPercent===undefined || raw.urgentPercent===null) && raw.urgentMultiplier!=null){
      merged.urgentPercent = Math.round((raw.urgentMultiplier-1)*100);
    }
    if(merged.urgentPercent==null) merged.urgentPercent = DEFAULT_CONFIG.urgentPercent;
    // migrate legacy techSharePercent -> payouts.technician.percent; ensure payouts shape always present
    if(!raw.payouts){
      merged.payouts = {

/* ============================= SESSION ============================= */
function restoreSession(){
  if(state.session) return;
  try{
    var raw = localStorage.getItem('medlab_session');
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.type==='staff'){
      var st = state.data.staff.filter(function(x){return x.id===s.staffId && x.active!==false;})[0];
      if(st) state.session = {type:'staff', staff:st};
    } else if(s.type==='doctor'){
      var doc = state.data.doctors.filter(function(x){return x.id===s.docId;})[0];
      if(doc) state.session = {type:'doctor', doctor:doc};
    }
  }catch(e){}
}
function saveSession(){
  try{
    if(!state.session){ localStorage.removeItem('medlab_session'); return; }
    if(state.session.type==='staff') localStorage.setItem('medlab_session', JSON.stringify({type:'staff', staffId:state.session.staff.id}));
    else localStorage.setItem('medlab_session', JSON.stringify({type:'doctor', docId:state.session.doctor.id}));
  }catch(e){}
}
function logout(){ state.session=null; state.ui.loginStep='choice'; state.ui.loginStaffId=null; state.ui.pinBuf=''; saveSession(); render(); }

/* ============================= BUSINESS LOGIC ============================= */
function calcDueDays(units, urgent){
  var c = cfg();
  if(urgent) return c.urgentDays;
  var tiers = c.deadlineTiers || DEFAULT_CONFIG.deadlineTiers;
  for(var i=0;i<tiers.length;i++){ if(units <= tiers[i].maxUnits) return tiers[i].days; }
  return tiers[tiers.length-1].days;
}
function isNonWorkingDay(iso){
  var c = cfg();
  var d = new Date(iso+'T00:00:00');
  var wd = d.getDay(); // 0=Вс,1=Пн,...6=Сб
  if((c.nonWorkingWeekdays||[]).indexOf(wd) > -1) return true;
  if((c.holidays||[]).indexOf(iso) > -1) return true;
  return false;
}
function nextWorkingDay(iso){
  var d = iso;
  var guard = 0;
  while(isNonWorkingDay(d) && guard < 60){ d = addDays(d, 1); guard++; }
  return d;
}
function genOrderCode(){
  var d = new Date();
  var ymd = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  var suf = Math.random().toString(36).slice(2,6).toUpperCase();
  return 'ORD-'+ymd+'-'+suf;
}
function orderPaid(orderId){
  return state.data.payments.filter(function(p){return p.orderId===orderId;}).reduce(function(a,p){return a+(p.amount||0);},0);
}
function dueClass(dueDate, stage){
  var stages = cfg().stages;
  if(stage===stages[stages.length-1]) return 'due-ok';
  var d = daysBetween(todayIso(), dueDate);
  if(d < 0) return 'due-late';
  if(d <= 1) return 'due-soon';
  return 'due-ok';
}
function dueLabel(dueDate, stage){
  var stages = cfg().stages;
  if(stage===stages[stages.length-1]) return 'Выдан';
  var d = daysBetween(todayIso(), dueDate);
  if(d < 0) return 'Просрочен на ' + Math.abs(d) + ' дн.';
  if(d === 0) return 'Срок сегодня';
  if(d === 1) return 'Срок завтра';
  return 'Срок через ' + d + ' дн.';
}
function staffName(id){ var s = state.data.staff.filter(function(x){return x.id===id;})[0]; return s? s.name : '—'; }
function canSeeMoney(){ if(!state.session || state.session.type!=='staff') return false; var r = STAFF_ROLES[state.session.staff.role]; return r && r.money; }
function isAdmin(){ return state.session && state.session.type==='staff' && (state.session.staff.role==='admin' || state.session.staff.role==='owner'); }
function isOwner(){ return state.session && state.session.type==='staff' && state.session.staff.role==='owner'; }
function patientSurname(name){
  var s = (name||'').trim();
  if(!s) return '—';
  return s.split(/\s+/)[0];
}
function materialLabel(m){ return m==='ZR' ? 'Цирконий (ZrO2)' : (m==='PMMA' ? 'Пластик (PMMA)' : '—'); }
function materialSuffix(m){ return m==='PMMA' ? '-01' : (m==='ZR' ? '-02' : ''); }
function calcPayout(o, role){
  var p = ((cfg().payouts||DEFAULT_CONFIG.payouts)[role]) || DEFAULT_CONFIG.payouts[role];
  if(!p) return 0;
  if(p.mode==='fixed'){
    if(o.material==='ZR') return p.fixedZr||0;
    if(o.material==='PMMA') return p.fixedPmma||0;
    return 0;
  }
  return Math.round((o.total||0) * (p.percent||0) / 100);
}

/* ---------- BOARD ---------- */
function renderBoard(){
  var stages = cfg().stages;
  var orders = state.data.orders;
  var role = state.session.staff.role;
  var onlyMine = state.ui.boardOnlyMine && (role==='technician' || role==='miller');
  if(onlyMine){
    var myId = state.session.staff.id;
    orders = orders.filter(function(o){ return o.assignedStaffId===myId || o.assignedMillerId===myId; });
  }
  var moneyOk = canSeeMoney();
  var toggle = (role==='technician'||role==='miller') ? '<label class="check"><input type="checkbox" data-act="toggleMine" '+(state.ui.boardOnlyMine?'checked':'')+'> Только мои заказы</label>' : '';

  var cols = stages.map(function(stage, idx){
    var inStage = orders.filter(function(o){ return o.stage===stage; });
    var sum = inStage.reduce(function(a,o){return a+(o.total||0);},0);
    var cards = inStage.map(function(o){ return renderCard(o, moneyOk); }).join('');
    return '<div class="column">'+
      '<div class="column-head"><span class="name">'+esc(stage)+'</span><span class="count">'+inStage.length+'</span></div>'+
      (moneyOk ? '<div class="column-sum">'+fmtMoney(sum)+'</div>' : '')+

  return '<div class="section-head">'+toggle+'</div><div class="board">'+cols+'</div>';

function renderCard(o, moneyOk){
  var dc = dueClass(o.dueDate, o.stage);

    '<div class="code">'+esc(o.code)+(o.urgent?' <span class="badge crit" style="margin-left:4px;">срочно</span>':'')+'</div>'+
    '<div class="pat">'+esc(o.patientName)+'</div>'+
    '<div class="doc">'+esc(o.doctorName||'')+(o.clinicName?' · '+esc(o.clinicName):'')+'</div>'+
    (assignee ? '<div class="doc">Исполнитель: '+esc(assignee)+'</div>' : '')+
    '<div class="metaRow"><span class="due '+dc+'">'+dueLabel(o.dueDate, o.stage)+'</span></div>'+
    (moneyOk ? '<div class="money">'+fmtMoney(o.total)+' · оплачено '+fmtMoney(paid)+'</div>' : '')+
  '</div>';
}

/* ---------- CALENDAR ---------- */
function shiftMonth(ym, delta){
  var p = ym.split('-'); var y = +p[0], m = +p[1] - 1 + delta;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y + '-' + String(m+1).padStart(2,'0');
}
function renderCalendar(){
  var base = state.ui.calMonth || todayIso().slice(0,7);
  var parts = base.split('-'); var y = +parts[0], m = +parts[1];
  var startWeekday = (new Date(y, m-1, 1).getDay() + 6) % 7; // Monday = 0
  var daysInMonth = new Date(y, m, 0).getDate();
  var monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var todayStr = todayIso();

  var ordersByDay = {};
  state.data.orders.forEach(function(o){
    if(!o.dueDate || o.dueDate.slice(0,7)!==base) return;
    (ordersByDay[o.dueDate] = ordersByDay[o.dueDate] || []).push(o);
  });

  var cells = '';
  for(var i=0;i<startWeekday;i++) cells += '<div class="cal-cell cal-empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var iso = base + '-' + String(d).padStart(2,'0');
    var dayOrders = ordersByDay[iso] || [];
    var chips = dayOrders.map(function(o){
      var dc = dueClass(o.dueDate, o.stage);
      var label = (o.patientName||'') + materialSuffix(o.material);
      return '<div class="cal-chip '+dc+'" data-act="openOrder" data-id="'+o.id+'" title="'+esc(o.patientName)+' — '+esc(o.stage)+'">'+esc(label)+'</div>';
    }).join('');
    cells += '<div class="cal-cell'+(iso===todayStr?' cal-today':'')+'"><div class="cal-daynum">'+d+'</div><div class="cal-chips">'+chips+'</div></div>';
  }
  var weekLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(w){return '<div class="cal-wd">'+w+'</div>';}).join('');

  return '<div class="cal-nav">'+
      '<button class="btn sm ghost" type="button" data-act="calPrev">←</button>'+
      '<b>'+monthNames[m-1]+' '+y+'</b>'+
      '<button class="btn sm ghost" type="button" data-act="calNext">→</button>'+
      '<button class="btn sm ghost" type="button" data-act="calToday">Сегодня</button>'+
    '</div>'+
    '<div class="cal-grid cal-head">'+weekLabels+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '<p class="hint" style="margin-top:12px;">Цвет — по сроку сдачи: зелёный — есть запас, жёлтый — сегодня/завтра, красный — просрочен. Клик по заказу открывает карточку.</p>';
}

function renderOrdersList(){
  var moneyOk = canSeeMoney();

    return (o.code+' '+o.patientName+' '+(o.doctorName||'')+' '+(o.clinicName||'')).toLowerCase().indexOf(q) > -1;
  });
  var sortSpec = state.ui.orderSort || {field:'createdAt', dir:'desc'};
  orders = orders.slice().sort(function(a,b){
    var av = a[sortSpec.field], bv = b[sortSpec.field];
    if(sortSpec.field==='total'){ av=+av||0; bv=+bv||0; return sortSpec.dir==='asc'? av-bv : bv-av; }
    av = av==null? '' : String(av); bv = bv==null? '' : String(bv);
    return sortSpec.dir==='asc'? av.localeCompare(bv) : bv.localeCompare(av);
  });
  var rows = orders.map(function(o){
    var dc = dueClass(o.dueDate, o.stage);
    var paid = orderPaid(o.id);
    return '<tr>'+
      '<td class="mono" data-act="openOrder" data-id="'+o.id+'" style="cursor:pointer;color:var(--accent);font-weight:600;">'+fmtDate((o.createdAt||'').slice(0,10))+'<div class="faint" style="font-size:11px;">'+esc(o.code)+'</div></td>'+
      '<td>'+esc(o.patientName)+'</td>'+
      '<td>'+esc(o.doctorName||'')+'<div class="faint">'+esc(o.clinicName||'')+'</div></td>'+

/* ---------- FINANCE ---------- */
function renderFinance(){
  var orders = state.data.orders;
  var payments = state.data.payments;
  var expenses = state.data.expenses;
  var monthStart = todayIso().slice(0,7)+'-01';
  var revenueMonth = payments.filter(function(p){return p.date>=monthStart;}).reduce(function(a,p){return a+p.amount;},0);
  var outstanding = orders.reduce(function(a,o){return a+Math.max(0,(o.total||0)-orderPaid(o.id));},0);
  var expenseMonth = expenses.filter(function(e){return e.date>=monthStart;}).reduce(function(a,e){return a+e.amount;},0);

  var techs = state.data.staff.filter(function(s){return s.role==='technician'||s.role==='miller';});
  var payoutRows = techs.map(function(t){
    var isMiller = t.role==='miller';
    var accrued = orders.filter(function(o){return isMiller ? o.assignedMillerId===t.id : o.assignedStaffId===t.id;})
      .reduce(function(a,o){
        var override = isMiller ? o.millerPayout : o.techPayout;
        return a + (override!=null ? override : calcPayout(o, isMiller?'miller':'technician'));
      },0);
    var paidOut = expenses.filter(function(e){return e.staffId===t.id && e.category==='Выплата технику';}).reduce(function(a,e){return a+e.amount;},0);
    return '<tr><td>'+esc(t.name)+'<div class="faint">'+(STAFF_ROLES[t.role]?STAFF_ROLES[t.role].label:t.role)+'</div></td><td class="mono">'+fmtMoney(accrued)+'</td><td class="mono">'+fmtMoney(paidOut)+'</td>'+
      '<td class="mono">'+fmtMoney(accrued-paidOut)+'</td>'+
      '<td><form data-act="payTech" data-id="'+t.id+'" style="display:flex; gap:6px;"><input type="number" name="amount" placeholder="сумма" min="1" style="width:100px;"><button class="btn sm primary" type="submit">Выплатить</button></form></td></tr>';
  }).join('');

  var expenseRows = expenses.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');}).map(function(e){
    return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.category)+(e.demo?'<span class="demo-tag">демо</span>':'')+'</td><td>'+esc(e.note||'')+'</td><td class="mono">'+fmtMoney(e.amount)+'</td></tr>';
  }).join('');

  return '<div class="stat-row">'+
    '<div class="stat-tile good"><div class="label">Оплаты за месяц</div><div class="value">'+fmtMoney(revenueMonth)+'</div></div>'+
    '<div class="stat-tile crit"><div class="label">Задолженность клиник</div><div class="value">'+fmtMoney(outstanding)+'</div></div>'+
    '<div class="stat-tile"><div class="label">Расходы за месяц</div><div class="value">'+fmtMoney(expenseMonth)+'</div></div>'+
    '<div class="stat-tile"><div class="label">Заказов активно</div><div class="value">'+orders.filter(function(o){return o.stage!==cfg().stages[cfg().stages.length-1];}).length+'</div></div>'+
  '</div>'+
  '<h3 style="margin-bottom:10px;">Выплаты техникам</h3>'+
  '<div class="table-wrap" style="margin-bottom:22px;"><table><thead><tr><th>Сотрудник</th><th>Начислено</th><th>Выплачено</th><th>Остаток</th><th></th></tr></thead><tbody>'+
  (payoutRows || '<tr><td colspan="5" class="empty-state">Нет технического персонала</td></tr>')+'</tbody></table></div>'+
  '<div class="section-head"><h3>Расходы и авансы</h3></div>'+
  '<form data-act="addExpense" class="card-panel" style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;">'+
    '<label class="field" style="min-width:160px;">Категория<select name="category"><option>Логистика (выездной скан)</option><option>Материалы</option><option>Аванс сотруднику</option><option>Прочее</option></select></label>'+
    '<label class="field" style="width:140px;">Сумма<input type="number" name="amount" min="1" required></label>'+
    '<label class="field" style="flex:1; min-width:160px;">Комментарий<input type="text" name="note"></label>'+
    '<button class="btn primary" type="submit">Добавить</button>'+
  '</form>'+
  '<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Категория</th><th>Комментарий</th><th>Сумма</th></tr></thead><tbody>'+
  (expenseRows || '<tr><td colspan="4" class="empty-state">Расходов нет</td></tr>')+'</tbody></table></div>';
}

    '</div>';

    '<div class="card-panel">'+doctorFieldsHtml+'</div>'+

/* ============================= ACTIONS ============================= */
function resetOrderDraft(){
  state.ui.draftItems=[]; state.ui.orderUrgent=false; state.ui.linkRows=[{label:'',url:''}]; state.ui.uploadFiles=[];
  state.ui.orderFields = {patientName:'', doctorId:'', newDoctorName:'', newDoctorClinic:'', newDoctorPhone:'', notes:'', material:''};
}
function renderUploadList(){
  var files = state.ui.uploadFiles||[];
  if(!files.length) return '';
  return files.map(function(f, i){
    var sizeStr = f.size ? (f.size>1048576 ? (f.size/1048576).toFixed(1)+' МБ' : Math.round(f.size/1024)+' КБ') : '';
    var status = f.status==='uploading' ? '<div class="uprog"><div class="uprog-bar" style="width:'+(f.progress||0)+'%"></div></div>'
      : f.status==='error' ? '<span class="badge crit">Ошибка</span>'
      : '<span class="badge good">Загружено · '+sizeStr+'</span>';
    return '<div class="upload-row"><span class="uname">'+esc(f.name)+'</span>'+status+'<button type="button" class="rm" data-act="rmUpload" data-idx="'+i+'">×</button></div>';
  }).join('');
}
function startUpload(file){
  var entry = {name:file.name, size:file.size, status:'uploading', progress:0, url:''};
  state.ui.uploadFiles.push(entry);
  var idx = state.ui.uploadFiles.length-1;
  render();
  var fd = new FormData(); fd.append('file', file);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = function(e){
    if(e.lengthComputable && state.ui.uploadFiles[idx]){
      state.ui.uploadFiles[idx].progress = Math.round(e.loaded/e.total*100);
      render();
    }
  };
  xhr.onload = function(){
    if(!state.ui.uploadFiles[idx]) return;
    if(xhr.status>=200 && xhr.status<300){
      try{
        var r = JSON.parse(xhr.responseText);
        state.ui.uploadFiles[idx].status='done'; state.ui.uploadFiles[idx].url=r.url; state.ui.uploadFiles[idx].size=r.size;
      }catch(e){ state.ui.uploadFiles[idx].status='error'; }
    } else { state.ui.uploadFiles[idx].status='error'; }
    render();

document.addEventListener('submit', async function(e){
  var form = e.target.closest('[data-act]');
  if(!form) return;
  e.preventDefault();
  var act = form.getAttribute('data-act');
  var fd = new FormData(form);
  try{

  if(act==='submitDocPhone'){
    var phone = (fd.get('phone')||'').toString().replace(/[^\d+]/g,'');
    if(!phone){ toast('Введите номер'); return; }
    state.ui.docPhone = phone;
    var existing = state.data.doctors.filter(function(d){return d.id===phone;})[0];
    if(existing){ state.session={type:'doctor', doctor:existing}; saveSession(); state.view='neworder'; render(); }
    else { state.ui.loginStep='docRegister'; render(); }
    return;
  }
  if(act==='submitDocRegister'){
    if(!state.db){ toast('Хранилище недоступно'); return; }
    var name = fd.get('name'), clinic = fd.get('clinic');
    var docObj = {name:name, clinic:clinic, phone:state.ui.docPhone, demo:false, createdAt:new Date().toISOString()};
    await state.db.collection('doctors').doc(state.ui.docPhone).set(docObj);
    state.session = {type:'doctor', doctor:Object.assign({id:state.ui.docPhone}, docObj)};
    saveSession(); state.view='neworder'; render();
    return;
  }

  if(act==='submitOrder'){
    if(!state.db){ toast('Нет соединения с сервером'); return; }
    var mode = form.getAttribute('data-mode');
    if(!state.ui.draftItems.length){ toast('Добавьте хотя бы одну позицию'); return; }
    var patientName = fd.get('patientName');
    var items = state.ui.draftItems.map(function(li){
      var u = li.unit==='tooth'? li.teeth.length : li.qty;
      if(u<=0) return null;
      return {lineId:li.lineId, itemId:li.itemId, name:li.name, unit:li.unit, teeth:li.teeth.slice(), qty:li.qty, addon:li.addon, unitPrice:li.unitPrice, addonPrice:li.addonPrice, lineTotal: u*(li.unitPrice+(li.addon?li.addonPrice:0))};
    }).filter(Boolean);
    if(!items.length){ toast('Укажите зубы или количество для позиций'); return; }
    var subtotal = items.reduce(function(a,i){return a+i.lineTotal;},0);
    var unitsTotal = items.reduce(function(a,i){return a+(i.unit==='tooth'?i.teeth.length:i.qty);},0);
    var urgent = !!state.ui.orderUrgent;
    var total = urgent? Math.round(subtotal*(1+cfg().urgentPercent/100)) : subtotal;
    var days = calcDueDays(unitsTotal, urgent);
    var due = nextWorkingDay(addDays(todayIso(), days));
    var links = state.ui.linkRows.filter(function(l){return l.url;})
      .concat((state.ui.uploadFiles||[]).filter(function(f){return f.status==='done';}).map(function(f){return {label:f.name, url:f.url};}));

    var doctorName, clinicName, doctorPhone, createdBy;
    if(mode==='doctor'){
      doctorName = state.session.doctor.name; clinicName = state.session.doctor.clinic; doctorPhone = state.session.doctor.id;
      createdBy = {type:'doctor', name:doctorName};
    } else {
      var did = fd.get('doctorId');
      if(did){
        var d = state.data.doctors.filter(function(x){return x.id===did;})[0];
        doctorName=d.name; clinicName=d.clinic; doctorPhone=d.id;
      } else {
        var nn = fd.get('newDoctorName'), nc = fd.get('newDoctorClinic'), np = (fd.get('newDoctorPhone')||'').toString().replace(/[^\d+]/g,'');
        if(!nn || !np){ toast('Укажите врача (выберите из списка или заполните данные нового)'); return; }
        doctorPhone = np;
        await state.db.collection('doctors').doc(np).set({name:nn, clinic:nc||'', phone:np, demo:false, createdAt:new Date().toISOString()});
        doctorName = nn; clinicName = nc||'';
      }
      createdBy = {type:'staff', name: state.session.staff.name};

      code:code, createdAt:new Date().toISOString(), createdBy:createdBy,

      material: fd.get('material') || null,
      items:items, urgent:urgent, subtotal:subtotal, total:total, unitsTotal:unitsTotal,
      dueDate:due, stage:cfg().stages[0], assignedStaffId:null, assignedMillerId:null,
      techPayout:null, millerPayout:null, links:links, notes: fd.get('notes')||'', statusHistory:[{stage:cfg().stages[0], at:new Date().toISOString()}], demo:false
    };

    var items2 = state.data.priceList.slice();
    items2.push({id:'x-'+uid(), category:fd.get('category'), name:fd.get('name'), price:+fd.get('price'), unit:fd.get('unit')});
    await state.db.doc('settings/priceList').set({items:items2});
    logActivity('price_add', 'Добавлена позиция прайса: '+fd.get('name'));
    form.reset(); toast('Позиция добавлена'); return;
  }
  if(act==='updatePrice'){
    if(!state.db) return;
    var pid = form.getAttribute('data-id'); var np2 = +fd.get('price');
    var items3 = state.data.priceList.map(function(it){ return it.id===pid? Object.assign({}, it, {price:np2}) : it; });
    await state.db.doc('settings/priceList').set({items:items3});
    logActivity('price_edit', 'Изменена цена позиции '+pid+' → '+fmtMoney(np2));
    toast('Цена обновлена'); return;
  }
  if(act==='saveSettings'){
    if(!state.db) return;
    var newCfg = Object.assign({}, cfg(), {
      labName: fd.get('labName'), urgentDays:+fd.get('urgentDays'), urgentPercent:+fd.get('urgentPercent'),
      stages: cfg().stages.slice(), deadlineTiers: cfg().deadlineTiers.slice(),
      payouts: { technician: Object.assign({}, cfg().payouts.technician), miller: Object.assign({}, cfg().payouts.miller) },
      nonWorkingWeekdays: (cfg().nonWorkingWeekdays||[]).slice(), holidays: (cfg().holidays||[]).slice(),
      notifyRoles: {
        newOrder: ((cfg().notifyRoles||{}).newOrder||[]).slice(),
        dueSoon: ((cfg().notifyRoles||{}).dueSoon||[]).slice(),
        overdue: ((cfg().notifyRoles||{}).overdue||[]).slice()
      }
    });
    delete newCfg.urgentMultiplier; delete newCfg.techSharePercent;
    await state.db.doc('settings/config').set(newCfg);
    logActivity('settings_edit', 'Изменены настройки лаборатории');
    toast('Настройки сохранены'); return;
  }

  }catch(err){ console.error(err); toast('Ошибка: '+(err&&err.message?err.message:'попробуйте ещё раз')); }
});

document.addEventListener('change', async function(e){
  var el = e.target;
  var act = el.getAttribute && el.getAttribute('data-act');
  if(!act) return;
  try{
    if(act==='assignStaff'){ if(!state.db) return; await state.db.collection('orders').doc(el.getAttribute('data-id')).update({assignedStaffId: el.value||null}); logActivity('order_assign', 'Назначен техник: '+(el.value?staffName(el.value):'—')); toast('Назначено'); }
    else if(act==='assignMiller'){ if(!state.db) return; await state.db.collection('orders').doc(el.getAttribute('data-id')).update({assignedMillerId: el.value||null}); logActivity('order_assign', 'Назначен фрезеровщик: '+(el.value?staffName(el.value):'—')); toast('Назначено'); }
    else if(act==='fld'){ state.ui.orderFields[el.getAttribute('data-f')] = el.value; }
    else if(act==='filesSelected'){
      var files = Array.prototype.slice.call(el.files||[]);
      files.forEach(function(f){ startUpload(f); });
      el.value = '';
    }
  }catch(err){ console.error(err); toast('Ошибка: '+(err&&err.message?err.message:'')); }
});

/* ---------- WEB PUSH ---------- */
function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}
async function togglePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){ toast('Уведомления не поддерживаются в этом браузере'); return; }
  try{
    var reg = await navigator.serviceWorker.ready;
    var existing = await reg.pushManager.getSubscription();
    if(existing){
      var subId = null;
      try{ subId = localStorage.getItem('medlab_push_sub_id'); }catch(e){}
      await existing.unsubscribe();
      if(subId && state.db){ try{ await state.db.collection('pushSubscriptions').doc(subId).delete(); }catch(e){} }
      try{ localStorage.removeItem('medlab_push_sub_id'); }catch(e){}
      state.ui.pushSubscribed = false; render(); toast('Уведомления отключены');
      return;
    }
    var perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Разрешение на уведомления не получено'); return; }
    var pkRes = await fetch('/api/push/public-key');
    var pk = await pkRes.json();
    if(!pk || !pk.publicKey){ toast('Не удалось получить ключ уведомлений'); return; }
    var sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(pk.publicKey) });
    var staffId = state.session && state.session.staff && state.session.staff.id;
    var r = await state.db.collection('pushSubscriptions').add({ staffId: staffId, subscription: sub.toJSON(), createdAt: new Date().toISOString() });
    try{ localStorage.setItem('medlab_push_sub_id', r.id); }catch(e){}
    state.ui.pushSubscribed = true; render(); toast('Уведомления включены');
  }catch(err){ console.error(err); toast('Ошибка уведомлений: '+(err&&err.message?err.message:'')); }
}

init();
})();

}
