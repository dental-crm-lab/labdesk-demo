<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LabDesk — подключение</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#14181B; color:#EDF2F4; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  .box{max-width:400px; width:100%; padding:0 24px; text-align:center;}
  .word{font-weight:800; font-size:34px; letter-spacing:1px;}
  .word em{font-style:normal; color:#E9576C;}
  .tag{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#728089; margin:4px 0 32px;}
  label{display:block; text-align:left; font-size:13px; font-weight:600; color:#A8B7BF; margin-bottom:6px;}
  input{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid #333F47; background:#1B2126; color:#EDF2F4;
    font-size:14px; margin-bottom:14px;
  }
  input:focus{outline:2px solid #E9576C;}
  button{
    width:100%; padding:12px; border-radius:9px; border:none; background:#E9576C; color:#20060A;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  button:hover{filter:brightness(1.05);}
  .hint{font-size:12px; color:#728089; margin-top:14px; line-height:1.5;}
  .err{font-size:12.5px; color:#E2703B; margin:-6px 0 12px; display:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="word">LabDesk<em>.</em></div>
    <div class="tag">CAD-CAM Lab</div>
    <form id="f">
      <label for="url">Адрес сервера</label>
      <input id="url" type="text" placeholder="labdesk-demo.up.railway.app" autofocus>
      <div class="err" id="err">Не удалось сохранить адрес — попробуйте ещё раз.</div>
      <button type="submit">Подключиться</button>
    </form>
    <div class="hint">Адрес сервера один раз даёт администратор лаборатории. Его можно поменять позже через меню «LabDesk → Сменить адрес сервера…».</div>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var val = document.getElementById('url').value.trim();
  if(!val) return;
  try{
    await window.electronAPI.saveServerUrl(val);
  }catch(err){
    document.getElementById('err').style.display = 'block';
  }
});
</script>
</body>
</html>
