<body>
  <div class="box">
    <div class="word"><span class="word-icon"></span>MedLab</div>
    <div class="tag">CAD-CAM Lab</div>
    <form id="f">
      <label for="url">Адрес сервера</label>
      <input id="url" type="text" placeholder="labdesk-demo-production.up.railway.app" autofocus>
      <div class="err" id="err">Не удалось сохранить адрес — попробуйте ещё раз.</div>
      <button type="submit">Подключиться</button>
    </form>
    <div class="hint">Адрес сервера один раз даёт администратор лаборатории. Его можно поменять позже через меню «MedLab → Сменить адрес сервера…».</div>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var val = document.getElementById('url').value.trim();
  if(!val) return;
  try{
    await window.electronAPI.saveServerUrl(val);
  }catch(err){
    document.getElementById('err').style.display = 'block';
  }
});
</script>
</body>
